<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GitHub Repo Search</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🔍 GitHub Repository Search</h1>

      <form id="searchForm">
        <input
          type="text"
          id="searchInput"
          placeholder="Search repositories (e.g. javascript)"
          required
        />
        <button type="submit">Search</button>
      </form>

      <p id="status"></p>

      <ul id="repoList"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
