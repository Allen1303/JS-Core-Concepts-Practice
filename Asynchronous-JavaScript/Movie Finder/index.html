<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Movie Finder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Movie Finder</h1>

      <form id="searchForm">
        <input
          type="text"
          id="searchInput"
          placeholder="Enter movie title..."
          required
        />
        <button type="submit" id="searchBtn">Search</button>
      </form>

      <p id="status"></p>
      <ul id="movieList"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
