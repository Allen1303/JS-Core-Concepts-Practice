<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Profile Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>User Profile</h1>

      <label>Name:</label>
      <input id="nameInput" type="text" />

      <label>Age:</label>
      <input id="ageInput" type="number" />

      <button id="saveBtn">Save Profile</button>

      <div class="profile">
        <h2 id="profileName">Name: —</h2>
        <h3 id="profileAge">Age: —</h3>
      </div>
      <button id="resetBtn">Reset Profile</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
