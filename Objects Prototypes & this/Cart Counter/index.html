<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cart">
      <h1>🛒 Your Cart</h1>

      <div class="cart-item">
        <span class="item-name">Basic T-Shirt</span>

        <div class="controls">
          <button id="removeBtn">−</button>
          <span id="countDisplay">0</span>
          <button id="addBtn">+</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
